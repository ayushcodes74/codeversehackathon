[project]
name = "universal-ai-web-assistant-backend"
version = "3.0.0"
description = "Backend service for Universal AI Web Assistant"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
